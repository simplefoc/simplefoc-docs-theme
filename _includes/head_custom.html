<!-- Copy to clipboard functionality for code blocks -->
<style>
  .code-wrapper {
    position: relative;
    margin-bottom: 1rem;
  }
  
  .copy-code-button {
    position: absolute;
    top: 8px;
    right: 8px;
    cursor: pointer;
    background-color: #f0f0f0;
    border: 1px solid #ccc;
    border-radius: 3px;
    padding: 4px 10px;
    font-size: 12px;
    color: #333;
    transition: all 0.2s;
    z-index: 10;
  }
  
  .copy-code-button:hover {
    background-color: #e0e0e0;
    border-color: #999;
    color: #000;
  }
  
  .copy-code-button.copied {
    background-color: rgba(76, 175, 80, 0.8);
    color: white;
    border-color: rgba(76, 175, 80, 1);
  }
</style>
